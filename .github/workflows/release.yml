name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create from the selected commit, e.g. v0.1.0"
        required: true
        type: string

env:
  VERSION: ${{ inputs.version || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    name: Test, package and GitHub release
    runs-on: ubuntu-24.04
    steps:
      - name: Check version format
        run: |
          [[ "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::'${VERSION}' is not a vX.Y.Z tag"; exit 1; }
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false
      - name: Policy and module tests
        run: |
          set -euo pipefail
          sudo scripts/install-opa.sh
          opa test policy --coverage --threshold 100 > /dev/null
          terraform -chdir=modules/baseline init -backend=false -input=false -no-color
          terraform -chdir=modules/baseline test -no-color
      - name: Package
        run: |
          set -euo pipefail
          mkdir dist
          git archive --format=tar.gz --prefix="gcp-baseline-${VERSION}/" -o "dist/gcp-baseline-${VERSION}.tar.gz" "${GITHUB_SHA}"
          (cd dist && sha256sum ./* > SHA256SUMS)
          ls -l dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${VERSION}" dist/* \
            --target "${GITHUB_SHA}" --title "${VERSION}" --generate-notes
